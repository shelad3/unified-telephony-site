<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unified Telephony for Android</title>
  <meta name="description" content="Unified Telephony — an all-in-one phone, SMS, and spam-screening app for Android. Download the latest APK here." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #273549;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #4f8cff;
      --accent-dark: #2f6ae8;
      --good: #34d399;
      --border: #334155;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
      color: #fff;
      margin: 0 auto 20px;
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .tagline { color: var(--muted); font-size: 15px; line-height: 1.5; margin-bottom: 28px; }
    .badge {
      display: inline-block;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .badge.live { border-color: var(--good); color: var(--good); }
    .badge.offline { border-color: #f87171; color: #f87171; }
    .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px; }
    .meta div {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .meta .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .meta .v { font-size: 16px; font-weight: 700; }
    .download {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.08s ease, filter 0.15s ease;
    }
    .download:active { transform: scale(0.98); }
    .download:hover { filter: brightness(1.08); }
    .download:disabled { opacity: 0.6; cursor: not-allowed; }
    .footnote { margin-top: 18px; font-size: 13px; color: var(--muted); }
    .footnote a { color: var(--accent); text-decoration: none; }
    .footnote a:hover { text-decoration: underline; }
    .error { color: #f87171; font-size: 14px; margin-top: 16px; display: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">UT</div>
    <h1>Unified Telephony</h1>
    <p class="tagline">An all-in-one phone app for Android: calls, SMS, caller-ID, and spam screening with themes you can customize.</p>
    <span class="badge offline" id="status">Checking for updates&hellip;</span>
    <div class="meta">
      <div>
        <div class="k">Latest version</div>
        <div class="v" id="version">&ndash;</div>
      </div>
      <div>
        <div class="k">APK size</div>
        <div class="v" id="size">&ndash;</div>
      </div>
    </div>
    <a class="download" id="downloadBtn" href="https://github.com/shelad3/unified-telephony/releases/latest/download/app-release.apk" rel="nofollow">Download APK</a>
    <div class="footnote" id="footnote"></div>
    <div class="error" id="error"></div>
  </main>

  <script>
    (function () {
      var API = 'https://api.github.com/repos/shelad3/unified-telephony/releases/latest';
      var btn = document.getElementById('downloadBtn');
      var status = document.getElementById('status');
      var version = document.getElementById('version');
      var sizeEl = document.getElementById('size');
      var footnote = document.getElementById('footnote');
      var err = document.getElementById('error');

      function formatBytes(bytes) {
        if (!bytes && bytes !== 0) return '&ndash;';
        var units = ['MB', 'GB'];
        var mb = bytes / (1024 * 1024);
        if (mb >= 1024) return (mb / 1024).toFixed(2) + ' GB';
        return mb.toFixed(1) + ' MB';
      }

      function formatDate(iso) {
        if (!iso) return '&ndash;';
        try {
          return new Date(iso).toUTCString().replace(', 2026', ', 2026');
        } catch (e) {
          return '&ndash;';
        }
      }

      fetch(API)
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (rel) {
          var name = rel.tag_name || rel.name || 'unknown';
          var asset = (rel.assets || []).find(function (a) {
            return /\.apk$/.test(a.name);
          });
          status.textContent = 'v' + name;
          status.className = 'badge live';
          version.textContent = 'v' + name;
          sizeEl.innerHTML = asset ? formatBytes(asset.size) : '&ndash;';
          if (asset) {
            btn.href = asset.browser_download_url;
            footnote.innerHTML = 'Released ' + formatDate(rel.published_at) +
              ' &middot; <a href="https://github.com/shelad3/unified-telephony" target="_blank" rel="noopener">Source code</a>';
          }
        })
        .catch(function (e) {
          status.textContent = 'Version unknown';
          status.className = 'badge offline';
          err.style.display = 'block';
          err.textContent = 'Could not reach the update server right now. The download button still points to the latest release.';
          console.error(e);
        });
    })();
  </script>
</body>
</html>
